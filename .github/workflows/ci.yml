name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installe les dependances
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Construit l'image du sandbox
        run: docker build -t agent-data-sandbox:latest -f docker/sandbox.Dockerfile docker/

      - name: Tests (pytest)
        # Docker est disponible sur les runners GitHub : les tests d'isolation du
        # sandbox tournent donc reellement en CI.
        run: uv run pytest

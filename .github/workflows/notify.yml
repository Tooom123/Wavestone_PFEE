name: Notification par mail

# Prévient par mail d'un échec de CI, et d'un succès sur develop et main. Désactivé tant que
# la variable de dépôt MAIL_NOTIFICATIONS n'est pas « true » et que les secrets SMTP
# (MAIL_SERVER, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO) ne sont pas renseignés.
# GitHub envoie déjà un mail à l'auteur d'un push en échec (réglage personnel
# Settings > Notifications > Actions) : ce workflow sert à prévenir toute l'équipe.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  mail:
    name: Envoi du mail
    if: >-
      vars.MAIL_NOTIFICATIONS == 'true' && (
        github.event.workflow_run.conclusion == 'failure' ||
        (github.event.workflow_run.conclusion == 'success' &&
         contains(fromJSON('["develop","main"]'), github.event.workflow_run.head_branch))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Agent Data CI <${{ secrets.MAIL_USERNAME }}>
          subject: "[CI ${{ github.event.workflow_run.conclusion }}] ${{ github.event.workflow_run.head_branch }}"
          body: |
            Branche : ${{ github.event.workflow_run.head_branch }}
            Résultat : ${{ github.event.workflow_run.conclusion }}
            Dernier commit : ${{ github.event.workflow_run.head_commit.message }}
            Détail : ${{ github.event.workflow_run.html_url }}

[project]
name = "agent-data"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Artus Cescon", email = "artus.cescon@epita.fr" },
    { name = "Estebane Brouillard", email = "estebane.brouillard@epita.fr" },
    { name = "Theodore Deguest", email = "theodore.deguest@epita.fr" },
    { name = "Tom Angles", email = "tom.angles@epita.fr" },
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.161.1",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "plotly>=7.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
agent-data = "agent_data.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langfuse.*", "langgraph.*", "plotly.*", "sklearn.*", "scipy.*", "pandera.*", "streamlit.*"]
ignore_missing_imports = true

[tool.bandit]
# B404/B603/B607 : l'agent pilote le CLI `docker` par conception (c'est le sandbox).
# Les arguments viennent de la configuration, jamais d'une entree utilisateur.
# B108 : le seul /tmp du code est un point de montage *dans le conteneur* (tmpfs du sandbox).
skips = ["B404", "B603", "B607", "B108"]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["agent_data"]
branch = false

[tool.coverage.report]
# Les tests du sandbox exigent Docker : en local sans Docker la couverture est plus basse.
fail_under = 75
show_missing = true
skip_covered = true

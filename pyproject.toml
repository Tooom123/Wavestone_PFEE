[project]
name = "agent-data"
version = "0.1.0"
description = "Agent d'analyse de donnees : question metier en langage naturel + CSV -> reponse analytique"
readme = "README.md"
authors = [
    { name = "tom.angles", email = "tom.angles.64@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.161.1",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "plotly>=7.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
agent-data = "agent_data.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
